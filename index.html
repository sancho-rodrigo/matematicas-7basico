<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía Interactiva 2.0 — Matemáticas 7° Básico — Liceo Isidora Zegers</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;padding:0;font-family:'Outfit',sans-serif;background:#0a0618}
:root{--bg1:#0a0618;--bg2:#140e2d;--bg3:#1e1545;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--purple:#8b5cf6;--purple-dim:#6d28d9;--purple-glow:rgba(139,92,246,0.3);--violet:#a78bfa;--emerald:#34d399;--emerald-dim:rgba(52,211,153,0.15);--rose:#fb7185;--rose-dim:rgba(251,113,133,0.15);--amber:#fbbf24;--amber-dim:rgba(251,191,36,0.15);--sky:#38bdf8;--text:#f1f5f9;--text-dim:rgba(241,245,249,0.5);--text-mid:rgba(241,245,249,0.7)}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes glow{0%,100%{box-shadow:0 0 12px var(--purple-glow)}50%{box-shadow:0 0 28px var(--purple-glow)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
input:focus{outline:none;box-shadow:0 0 0 2px var(--purple)}
button{cursor:pointer;border:none;font-family:'Outfit',sans-serif;transition:all .2s}
button:hover{filter:brightness(1.1)}
button:active{transform:scale(.97)!important}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--purple-dim);border-radius:3px}
.anim-in{animation:fadeIn .4s ease}.anim-shake{animation:shake .4s}.anim-pop{animation:pop .4s}.anim-slide{animation:slideDown .3s ease}
.topic-card{transition:all .3s}
.topic-card:hover{transform:translateY(-4px);border-color:var(--purple)!important;box-shadow:0 8px 32px rgba(139,92,246,0.15)}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef}=React;

/* ═══════ MATH ═══════ */
const gcd=(a,b)=>{a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);
const simplify=(n,d)=>{if(!d)return[n,d];const g=gcd(n,d);let sn=n/g,sd=d/g;if(sd<0){sn=-sn;sd=-sd}return[sn,sd]};
const ri=(mn,mx)=>Math.floor(Math.random()*(mx-mn+1))+mn;
const fracEq=(n1,d1,n2,d2)=>n1*d2===n2*d1;
const toMixed=(n,d)=>{const[sn,sd]=simplify(n,d);if(sd===1)return{w:sn,n:0,d:1};const w=Math.floor(Math.abs(sn)/sd)*(sn<0?-1:1);const rem=Math.abs(sn)%sd;return{w,n:rem,d:sd}};

/* ═══════ FRAC DISPLAY ═══════ */
const F=({n,d,w,sz=20,c})=>{
  const cl=c||"inherit";
  const s={display:"inline-flex",alignItems:"center",gap:3,fontFamily:"'Cambria Math','Times New Roman',serif",color:cl,verticalAlign:"middle"};
  if(d===1&&!w)return<span style={{...s,fontSize:sz*1.1,fontWeight:700}}>{n}</span>;
  return<span style={s}>
    {(w!==undefined&&w!==0)?<span style={{fontSize:sz*1.3,fontWeight:700,marginRight:2}}>{w}</span>:null}
    <span style={{display:"inline-flex",flexDirection:"column",alignItems:"center",lineHeight:1.1}}>
      <span style={{fontSize:sz,fontWeight:700,borderBottom:`2px solid ${cl==="inherit"?"currentColor":cl}`,paddingBottom:2,minWidth:Math.max(16,sz),textAlign:"center"}}>{n}</span>
      <span style={{fontSize:sz,fontWeight:700,paddingTop:2,minWidth:Math.max(16,sz),textAlign:"center"}}>{d}</span>
    </span>
  </span>;
};

/* ═══════ EXPR WITH STACKED FRACS ═══════ */
const ExprF=({expr,sz=22})=>{
  const tokens=expr.split(/\s+/);
  return<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,flexWrap:"wrap"}}>
    {tokens.map((t,i)=>{
      if(["+","−","-","×","÷","(",")"].includes(t))return<span key={i} style={{color:"var(--violet)",fontSize:sz,fontWeight:700}}>{t}</span>;
      const m=t.match(/^(\d+)\/(\d+)$/);
      if(m)return<F key={i} n={parseInt(m[1])} d={parseInt(m[2])} sz={sz-2}/>;
      return<span key={i} style={{fontSize:sz,fontWeight:700}}>{t}</span>;
    })}
    <span style={{color:"var(--text-dim)",fontSize:sz,marginLeft:4}}>=</span>
  </div>;
};

/* ═══════ AREA MODEL ═══════ */
const AreaModel=({n1,d1,n2,d2})=>{
  const sC=Math.min(n1,d1),sR=Math.min(n2,d2);
  const W=240,H=240,cw=W/d1,ch=H/d2;
  return<div style={{display:"flex",flexDirection:"column",alignItems:"center",margin:"16px 0"}}>
    <p style={{fontSize:11,color:"var(--text-dim)",marginBottom:6,fontWeight:600,letterSpacing:1,textTransform:"uppercase"}}>Modelo de Área</p>
    <svg width={W} height={H} style={{borderRadius:8,border:"2px solid var(--border)"}}>
      <rect width={W} height={H} fill="rgba(255,255,255,0.03)"/>
      {Array.from({length:d2+1}).map((_,i)=><line key={`h${i}`} x1={0} y1={i*ch} x2={W} y2={i*ch} stroke="rgba(255,255,255,0.15)" strokeWidth="1.5"/>)}
      {Array.from({length:d1+1}).map((_,i)=><line key={`v${i}`} x1={i*cw} y1={0} x2={i*cw} y2={H} stroke="rgba(255,255,255,0.15)" strokeWidth="1.5"/>)}
      <rect x={0} y={0} width={sC*cw} height={H} fill="rgba(139,92,246,0.2)"/>
      <rect x={0} y={0} width={W} height={sR*ch} fill="rgba(251,191,36,0.2)"/>
      <rect x={0} y={0} width={sC*cw} height={sR*ch} fill="rgba(52,211,153,0.45)" stroke="var(--emerald)" strokeWidth="2"/>
      <text x={sC*cw/2} y={sR*ch/2+5} textAnchor="middle" fill="white" fontSize="14" fontWeight="700" fontFamily="Outfit">{sC*sR}/{d1*d2}</text>
    </svg>
    <div style={{display:"flex",gap:14,marginTop:6,fontSize:11}}>
      <span style={{color:"var(--violet)"}}>■ <F n={n1} d={d1} sz={10}/></span>
      <span style={{color:"var(--amber)"}}>■ <F n={n2} d={d2} sz={10}/></span>
      <span style={{color:"var(--emerald)"}}>■ Producto</span>
    </div>
  </div>;
};

/* ═══════ NUMBER LINE ═══════ */
const NumLine=({n1,d1,n2,d2})=>{
  const dv=n1/d1,sv=n2/d2,jumps=Math.round(dv/sv);
  const maxV=Math.max(Math.ceil(dv)+1,3);
  const W=500,H=120,M=35,px=(W-2*M)/maxV;
  const cols=["#8b5cf6","#34d399","#fb7185","#38bdf8","#fbbf24","#a78bfa","#f472b6"];
  return<div style={{display:"flex",flexDirection:"column",alignItems:"center",margin:"16px 0",overflowX:"auto",width:"100%"}}>
    <p style={{fontSize:11,color:"var(--text-dim)",marginBottom:6,fontWeight:600,letterSpacing:1,textTransform:"uppercase"}}>Recta Numérica</p>
    <svg width={W} height={H}>
      <defs><marker id="aNL" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--text-dim)"/></marker></defs>
      <line x1={M} y1={80} x2={W-M} y2={80} stroke="var(--text-dim)" strokeWidth="2" markerEnd="url(#aNL)"/>
      {Array.from({length:maxV*d2+1}).map((_,i)=>{
        const v=i/d2,x=M+v*px,isW=i%d2===0;if(x>W-M+5)return null;
        return<g key={i}><line x1={x} y1={isW?72:76} x2={x} y2={isW?88:84} stroke="var(--text-dim)" strokeWidth={isW?2:1}/>{isW&&<text x={x} y={102} textAnchor="middle" fill="var(--text-dim)" fontSize="11" fontFamily="Outfit">{Math.round(v)}</text>}</g>;
      })}
      <circle cx={M+dv*px} cy={80} r={5} fill="var(--rose)"/>
      <text x={M+dv*px} y={118} textAnchor="middle" fill="var(--rose)" fontSize="10" fontFamily="Outfit" fontWeight="600">{n1}/{d1}</text>
      {Array.from({length:jumps}).map((_,i)=>{
        const sx=M+(i*sv)*px,ex=M+((i+1)*sv)*px,mx=(sx+ex)/2;
        return<g key={`j${i}`}><path d={`M${sx} 80 Q${mx} ${32-i*3} ${ex} 80`} fill="none" stroke={cols[i%7]} strokeWidth="2.5" strokeDasharray="5,3"/><text x={mx} y={24-i*3} textAnchor="middle" fill={cols[i%7]} fontSize="10" fontFamily="Outfit" fontWeight="700">salto {i+1}</text></g>;
      })}
    </svg>
    <p style={{fontSize:12,color:"var(--text-mid)",marginTop:4}}>¿Cuántos saltos de <F n={n2} d={d2} sz={10}/> caben en <F n={n1} d={d1} sz={10}/>? → <b style={{color:"var(--emerald)"}}>{jumps}</b></p>
  </div>;
};

/* ═══════ CONFETTI ═══════ */
const Confetti=({on})=>{
  if(!on)return null;
  const c=["#8b5cf6","#34d399","#fbbf24","#fb7185","#38bdf8","#a78bfa","#f472b6","#10b981"];
  return<div style={{position:"fixed",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:9999}}>
    {Array.from({length:40}).map((_,i)=><div key={i} style={{position:"absolute",left:`${Math.random()*100}%`,top:-10,width:ri(6,12),height:ri(6,12),background:c[i%8],borderRadius:i%3===0?"50%":"2px",animation:`confettiFall ${1.2+Math.random()*1.2}s ease-in ${Math.random()*0.5}s forwards`}}/>)}
  </div>;
};

/* ═══════ KA LINKS (all verified to parent section pages) ═══════ */
const KA={
  addFrac:{t:"Suma y resta de fracciones",u:"https://es.khanacademy.org/math/arithmetic/fraction-arithmetic"},
  multFrac:{t:"Multiplicación de fracciones",u:"https://es.khanacademy.org/math/arithmetic/fraction-arithmetic"},
  divFrac:{t:"División de fracciones",u:"https://es.khanacademy.org/math/arithmetic/fraction-arithmetic"},
  fracDec:{t:"Fracciones y decimales",u:"https://es.khanacademy.org/math/arithmetic/arith-decimals"},
  multDec:{t:"Multiplicación de decimales",u:"https://es.khanacademy.org/math/arithmetic/arith-decimals"},
  divDec:{t:"División de decimales",u:"https://es.khanacademy.org/math/arithmetic/arith-decimals"},
  fact10:{t:"Multiplicar y dividir por 10, 100, 1000",u:"https://es.khanacademy.org/math/arithmetic/arith-decimals"},
  problems:{t:"Problemas con fracciones y decimales",u:"https://es.khanacademy.org/math/arithmetic/fraction-arithmetic"},
  combined:{t:"Operatoria combinada",u:"https://es.khanacademy.org/math/arithmetic/fraction-arithmetic"}
};

/* ═══════════════════════════════════════════
   EXERCISE GENERATORS — truly random
   ═══════════════════════════════════════════ */
const GEN={
  /* ── SUMA/RESTA ── */
  addFrac:()=>{
    const isAdd=Math.random()>0.4;
    const easy=Math.random()>0.45;
    let n1,d1,n2,d2,cd,an1,an2,hint;
    if(easy){
      // One denom divides the other
      const base=ri(2,9),mult=ri(2,4),bigD=base*mult;
      d1=base;d2=bigD;n1=ri(1,d1-1);n2=ri(1,d2-1);
      if(Math.random()>0.5)[n1,d1,n2,d2]=[n2,d2,n1,d1];
      cd=lcm(d1,d2);an1=n1*(cd/d1);an2=n2*(cd/d2);
      const sm=d1<d2?d1:d2,factor=cd/sm;
      hint=`${Math.max(d1,d2)} es múltiplo de ${Math.min(d1,d2)}. Amplifica solo la de denominador ${sm} por ${factor}: ${sm===d1?n1:n2}/${sm} → ${sm===d1?an1:an2}/${cd}. Luego ${isAdd?"suma":"resta"}.`;
    }else{
      do{d1=ri(2,12);d2=ri(2,12)}while(d1===d2||d1%d2===0||d2%d1===0);
      n1=ri(1,d1*2);n2=ri(1,d2-1);
      cd=lcm(d1,d2);an1=n1*(cd/d1);an2=n2*(cd/d2);
      hint=`MCM(${d1},${d2})=${cd}. Amplifica: ${n1}/${d1}→${an1}/${cd} y ${n2}/${d2}→${an2}/${cd}. Luego ${isAdd?"suma":"resta"} numeradores.`;
    }
    let rn=isAdd?an1+an2:an1-an2,op=isAdd?"+":"−";
    if(rn<0){rn=an1+an2;op="+"}
    const[sn,sd]=simplify(Math.abs(rn),cd);
    return{type:"frac",display:{n1,d1,op,n2,d2},ans:{n:sn,d:sd},ka:"addFrac",hint};
  },

  /* ── MULT FRACCIONES ── */
  multFrac:()=>{
    const t=ri(0,3);let n1,d1,n2,d2;
    if(t===0){d1=ri(2,10);n1=ri(1,d1-1);d2=ri(2,10);n2=ri(1,d2-1)}
    else if(t===1){d1=ri(2,6);n1=ri(d1+1,d1*3);d2=ri(2,9);n2=ri(1,d2-1)}
    else if(t===2){const w=ri(1,4);d1=ri(2,6);n1=w*d1+ri(1,d1-1);d2=ri(2,8);n2=ri(1,d2-1)}
    else{n1=ri(2,9);d1=1;d2=ri(2,10);n2=ri(1,d2-1)}
    const[sn,sd]=simplify(n1*n2,d1*d2);
    const canArea=n1<=d1&&n2<=d2&&d1<=8&&d2<=8;
    return{type:"frac",display:{n1,d1,op:"×",n2,d2},ans:{n:sn,d:sd},ka:"multFrac",showArea:canArea,
      hint:`Num: ${n1}×${n2}=${n1*n2}. Den: ${d1}×${d2}=${d1*d2}. MCD=${gcd(n1*n2,d1*d2)}. Simplifica.`};
  },

  /* ── DIV FRACCIONES: visual vs algorithmic ── */
  divFrac:()=>{
    const wantVisual=Math.random()>0.45;
    let n1,d1,n2,d2;
    if(wantVisual){
      // Produce integer result, small numbers
      const result=ri(2,6);const dd=ri(2,6);
      const pick=ri(0,2);
      if(pick===0){n1=result;d1=1;n2=1;d2=dd}        // e.g. 4 ÷ 1/2
      else if(pick===1){n1=result;d1=dd;n2=1;d2=dd}   // e.g. 3/4 ÷ 1/4
      else{const m=ri(2,3);n1=m;d1=dd;n2=1;d2=dd}     // e.g. 2/5 ÷ 1/5
    }else{
      d1=ri(2,9);n1=ri(1,d1*2);d2=ri(2,9);n2=ri(1,d2);
    }
    const[sn,sd]=simplify(n1*d2,d1*n2);
    const rv=(n1*d2)/(d1*n2);
    const isVF=wantVisual&&Number.isInteger(rv)&&rv>=1&&rv<=8;
    return{type:"frac",display:{n1,d1,op:"÷",n2,d2},ans:{n:sn,d:sd},ka:"divFrac",showLine:isVF,
      hint:`Inverso de ${n2}/${d2} es ${d2}/${n2}. Multiplica: ${n1}/${d1} × ${d2}/${n2} = ${n1*d2}/${d1*n2}. Simplifica.`};
  },

  /* ── FRAC ↔ DEC ── */
  fracDec:()=>{
    if(Math.random()>0.5){
      const d=ri(2,12);const n=ri(1,d*2);
      return{type:"toDec",display:{n1:n,d1:d},ans:{dec:Math.round((n/d)*10000)/10000},ka:"fracDec",
        hint:`Divide ${n} ÷ ${d}. Si es periódico, redondea a 2 decimales.`};
    }else{
      const dl=ri(1,3),pw=Math.pow(10,dl),nm=ri(1,pw-1),dec=nm/pw;
      const[sn,sd]=simplify(nm,pw);
      return{type:"toFrac",displayDec:dec.toFixed(dl).replace(".",","),ans:{n:sn,d:sd},ka:"fracDec",
        hint:`${dec.toFixed(dl)} = ${nm}/${pw}. MCD=${gcd(nm,pw)} → ${sn}/${sd}.`};
    }
  },

  /* ── MULT DECIMALES ── */
  multDec:()=>{
    const a=ri(11,999)/10,bPool=[ri(2,9),ri(11,99)/10];
    const b=bPool[ri(0,1)];
    const aStr=a%1===0?a.toFixed(1):parseFloat(a.toFixed(2)).toString();
    const bStr=b%1===0?b.toString():parseFloat(b.toFixed(2)).toString();
    const dA=(aStr.split(".")[1]||"").length,dB=(bStr.split(".")[1]||"").length;
    const ans=Math.round(a*b*10000)/10000;
    return{type:"dec",displayDec:`${aStr.replace(".",",")} × ${bStr.replace(".",",")}`,ans:{dec:ans},ka:"multDec",
      stepByStep:{a:aStr,b:bStr,decPlaces:dA+dB},
      hint:`Decimales: ${dA}+${dB}=${dA+dB}. Multiplica sin coma: ${aStr.replace(".","")}×${bStr.replace(".","")}. Pon la coma ${dA+dB} lugar(es) desde la derecha.`};
  },

  /* ── DIV DECIMALES paso a paso ── */
  divDec:()=>{
    const ans=ri(2,30);
    const dW=ri(0,9),dD=ri(1,9),divisor=dW+dD/10;
    const dividend=Math.round(ans*divisor*100)/100;
    const dP=(divisor.toString().split(".")[1]||"").length;
    const factor=Math.pow(10,dP);
    const aDiv=parseFloat((dividend*factor).toFixed(4)),aDsr=Math.round(divisor*factor);
    return{type:"divDecStep",dividend,divisor,correctPower:factor,ampDividend:aDiv,ampDivisor:aDsr,quotient:ans,
      ans:{dec:ans},ka:"divDec",
      hint:`Divisor ${divisor.toString().replace(".",",")} tiene ${dP} decimal(es). Amplifica ×${factor}.`};
  },

  /* ── FACTORES 10,100,1000 ── */
  fact10:()=>{
    const whole=ri(0,99),dec=ri(1,999),dl=ri(1,3);
    const num=whole+dec/Math.pow(10,dl);
    const f=[10,100,1000][ri(0,2)];const isMult=Math.random()>0.5;
    const ans=isMult?num*f:num/f;
    const nStr=num.toFixed(dl);
    return{type:"dec",displayDec:`${nStr.replace(".",",")} ${isMult?"×":"÷"} ${f.toLocaleString("es-CL")}`,ans:{dec:Math.round(ans*100000)/100000},ka:"fact10",
      hint:`Mueve la coma ${Math.log10(f)} lugar(es) a la ${isMult?"DERECHA":"IZQUIERDA"}.`};
  },

  /* ── PROBLEMAS CONTEXTUALIZADOS ── */
  problems:()=>{
    const tpl=[
      ()=>{const n=ri(3,12);const p=[1.25,1.5,2.5,2.75,3.25,4.5,0.75][ri(0,6)];
        const items=["botellas de agua","kilos de harina","kilos de mariscos","panes","litros de leche","kilos de papas"][ri(0,5)];
        const place=["Angelmó","la feria de Puerto Montt","la costanera","Chiloé"][ri(0,3)];
        return{text:`En ${place}, compraron ${n} ${items} de ${p.toString().replace(".",",")} kg cada uno. ¿Cuántos kg en total?`,
          ans:{dec:Math.round(n*p*100)/100},
          steps:[`Datos: ${n} unidades de ${p.toString().replace(".",",")} kg.`,"Operación: multiplicación (repetir la misma cantidad).",`Plantear: ${n} × ${p.toString().replace(".",",")} = ?`]};
      },
      ()=>{const total=[4.5,6.4,7.2,8.1,9.6,12.5,15.6][ri(0,6)];const g=ri(3,12);
        const ans=Math.round(total/g*100)/100;
        return{text:`Hay ${total.toString().replace(".",",")} litros de jugo de murta para repartir en ${g} vasos iguales. ¿Cuántos litros tiene cada vaso?`,
          ans:{dec:ans},
          steps:[`Datos: ${total.toString().replace(".",",")} litros, ${g} vasos.`,"Operación: división (repartir en partes iguales).",`Plantear: ${total.toString().replace(".",",")} ÷ ${g} = ?`]};
      },
      ()=>{const total=[3.6,4.5,5.4,7.2,8.4,9.6][ri(0,5)];const piece=[0.3,0.4,0.45,0.6,0.9,1.2][ri(0,5)];
        const ans=Math.round(total/piece);
        return{text:`Teresa cortó una cuerda de ${total.toString().replace(".",",")} m en trozos de ${piece.toString().replace(".",",")} m para la costanera. ¿Cuántos trozos?`,
          ans:{dec:ans},
          steps:["Datos: largo total y tamaño de cada trozo.","Operación: división (¿cuántas veces cabe el trozo?).",`Plantear: ${total.toString().replace(".",",")} ÷ ${piece.toString().replace(".",",")} = ?`]};
      },
      ()=>{const l=[1.25,1.5,2.5,0.75][ri(0,3)];const d=ri(5,14);
        return{text:`Juan prepara ${l.toString().replace(".",",")} litros de jugo de murtilla cada día. ¿Cuántos litros en ${d} días?`,
          ans:{dec:Math.round(l*d*100)/100},
          steps:[`Datos: ${l.toString().replace(".",",")} litros/día, ${d} días.`,"Operación: multiplicación (repetir cada día).",`Plantear: ${l.toString().replace(".",",")} × ${d} = ?`]};
      },
      ()=>{const total=ri(3,10);const dd=ri(2,8);const ans=total*dd;
        return{text:`Una botella tiene ${total} litros de chicha. Si cada vaso es de`,fracInText:{n:1,d:dd},textAfter:`de litro, ¿cuántos vasos puede llenar?`,
          ans:{dec:ans},
          steps:[`Datos: ${total} litros, cada vaso = 1/${dd} litro.`,`Operación: ${total} ÷ 1/${dd} = ${total} × ${dd}.`,`Resultado: ${ans} vasos.`]};
      },
      ()=>{const w=ri(1,3);const nd=[[1,3],[2,3],[1,4],[3,4],[1,6],[5,6]][ri(0,5)];
        const tN=w*nd[1]+nd[0],tD=nd[1];const pd=ri(2,8);
        const ans=Math.round((tN/tD)/(1/pd)*100)/100;
        return{text:`Catalina preparó ${w}`,fracInText:{n:nd[0],d:nd[1]},textAfter:`kg de mermelada de murta. Cada frasco contiene`,fracInText2:{n:1,d:pd},textAfter2:`kg. ¿Cuántos frascos necesita?`,
          ans:{dec:ans},
          steps:[`Convertir mixto: ${w} ${nd[0]}/${nd[1]} = ${tN}/${tD} kg.`,`Dividir: ${tN}/${tD} ÷ 1/${pd} = ${tN}/${tD} × ${pd}/1.`,`Calcular: ${tN*pd}/${tD}. Simplificar.`]};
      },
    ];
    const g=tpl[ri(0,tpl.length-1)]();
    return{type:"problem",...g,ka:"problems",
      hint:"1) Subraya datos. 2) ¿Repartes? → divide. ¿Repites? → multiplica. 3) Opera."};
  },

  /* ── COMBINADOS ── */
  combined:()=>{
    const pool=[
      {e:"1/4 × 2/3 + 3/4 ÷ 1/2",n:5,d:3},
      {e:"2/3 − 3/4 × 2/3 + 5/6",n:1,d:1},
      {e:"5/8 ÷ 1/4 − 3/2 × 1/3",n:2,d:1},
      {e:"3/5 + 1/2 × 4/5",n:1,d:1},
      {e:"7/6 ÷ 7/12 + 1/3",n:7,d:3},
      {e:"2/3 × 3/4 − 1/6 + 1/2",n:5,d:6},
      {e:"1/2 + 1/3 × 3/2",n:1,d:1},
      {e:"3/4 ÷ 3/8 − 1/2",n:3,d:2},
      {e:"2/5 × 5/4 + 1/2",n:1,d:1},
      {e:"1/3 + 2/3 × 1/2",n:2,d:3},
      {e:"5/6 − 1/3 × 1/2",n:2,d:3},
      {e:"4/3 ÷ 2/3 + 1/6",n:13,d:6},
      {e:"1/2 × 3/5 + 1/4",n:11,d:20},
      {e:"7/8 − 1/4 ÷ 1/2",n:3,d:8},
      {e:"2/3 + 1/6 × 2/1",n:1,d:1},
      {e:"5/4 ÷ 5/8 − 1/2",n:3,d:2},
      {e:"1/3 × 3/4 + 5/6",n:13,d:12},
      {e:"3/2 − 2/3 ÷ 4/3",n:1,d:1},
      {e:"4/5 × 5/6 + 1/3",n:1,d:1},
      {e:"7/4 ÷ 7/8 − 3/4",n:5,d:4},
    ];
    const x=pool[ri(0,pool.length-1)];
    const[sn,sd]=simplify(x.n,x.d);
    return{type:"combined",displayExpr:x.e,ans:{n:sn,d:sd},ka:"combined",
      hint:"1° Paréntesis → 2° ×/÷ izq a der → 3° +/− izq a der."};
  }
};

const MSG_NO=["¡Casi! Revisa 💪","Sigue intentando 🌱","Cada error enseña ✨","Mira la pista 📐","¡No te rindas! 🌈"];

const getGrade=p=>{if(p>=95)return"7,0";if(p>=88)return"6,5";if(p>=80)return"6,0";if(p>=72)return"5,5";if(p>=65)return"5,0";if(p>=58)return"4,5";if(p>=50)return"4,0";if(p>=40)return"3,5";if(p>=30)return"3,0";return"2,0"};

/* ═══════════════════ MAIN APP ═══════════════════ */
function App(){
  const[view,setView]=useState("home");
  const[tid,setTid]=useState(null);
  const[ex,setEx]=useState(null);
  const[ua,setUa]=useState({whole:"",num:"",den:"",dec:""});
  const[fb,setFb]=useState(null);
  const[hintOn,setHintOn]=useState(false);
  const[visOn,setVisOn]=useState(false);
  const[stepsOn,setStepsOn]=useState(false);
  const[helperOn,setHelperOn]=useState(false);
  const[confetti,setConfetti]=useState(false);
  const[stats,setStats]=useState({total:0,ok:0,streak:0,mx:0,bt:{},badges:[],retried:false,consec:{}});
  const[name,setName]=useState("");
  const[named,setNamed]=useState(false);
  const[toast,setToast]=useState(null);
  const[kaModal,setKaModal]=useState(null);
  const[sk,setSk]=useState(0);
  const[dStep,setDStep]=useState(1);
  const[dIn,setDIn]=useState({pw:"",ad:"",as:"",q:""});
  const[dFb,setDFb]=useState("");
  const ref=useRef(null);

  useEffect(()=>{try{const v=localStorage.getItem("ms7v5");if(v){const d=JSON.parse(v);setStats(d);setName(d.nm||"");if(d.nm)setNamed(true)}}catch{}},[]);
  const save=useCallback(s=>{setStats(s);try{localStorage.setItem("ms7v5",JSON.stringify({...s,nm:name}))}catch{}},[name]);

  const gen=useCallback(id=>{
    const t=TOPICS.find(t=>t.id===id);if(!t)return;
    setEx(t.gen());setUa({whole:"",num:"",den:"",dec:""});setFb(null);setHintOn(false);setVisOn(false);setStepsOn(false);setHelperOn(false);
    setDStep(1);setDIn({pw:"",ad:"",as:"",q:""});setDFb("");
    setTimeout(()=>ref.current?.focus(),150);
  },[]);

  const start=id=>{setTid(id);setView("practice");gen(id)};

  const consecCheck=(id,ok)=>{
    const c={...(stats.consec||{})};
    if(ok){c[id]=0}else{
      c[id]=(c[id]||0)+1;
      if(c[id]>=2){setKaModal({topic:TOPICS.find(t=>t.id===id)?.name||"",ka:ex?.ka||id});c[id]=0}
    }
    return c;
  };

  const finish=(ok)=>{
    const ns=stats.streak+(ok?1:0),nmx=Math.max(stats.mx,ok?ns:0);
    const bt={...(stats.bt[tid]||{t:0,o:0})};bt.t++;if(ok)bt.o++;
    const consec=consecCheck(tid,ok);
    const nst={...stats,total:stats.total+1,ok:stats.ok+(ok?1:0),streak:ok?ns:0,mx:nmx,bt:{...stats.bt,[tid]:bt},badges:[...stats.badges],consec};
    BADGES.forEach(b=>{if(!nst.badges.includes(b.id)&&b.req(nst)){nst.badges.push(b.id);setToast(b);setTimeout(()=>setToast(null),3500)}});
    let cs="";
    if(ex.ans?.dec!=null)cs=ex.ans.dec.toString().replace(".",",");
    else if(ex.ans?.n!=null)cs=ex.ans.d===1?`${ex.ans.n}`:`${ex.ans.n}/${ex.ans.d}`;
    setFb({ok,msg:ok?MSG_OK[ri(0,6)]:MSG_NO[ri(0,4)],corr:cs});
    if(ok){setConfetti(true);setTimeout(()=>setConfetti(false),2500)}else setSk(k=>k+1);
    save(nst);
  };

  const check=()=>{
    if(!ex||ex.type==="divDecStep")return;
    let ok=false;
    if(ex.type==="dec"||ex.type==="toDec"||ex.type==="problem"){
      const v=parseFloat(ua.dec.replace(",","."));
      const t=ex.ans?.dec!=null?ex.ans.dec:ex.ans;
      ok=!isNaN(v)&&Math.abs(v-t)<0.015;
    }else{
      const w=parseInt(ua.whole)||0,un=parseInt(ua.num),ud=parseInt(ua.den);
      if(!isNaN(un)&&!isNaN(ud)&&ud!==0)ok=fracEq(w*ud+un,ud,ex.ans.n,ex.ans.d);
    }
    finish(ok);
  };

  // Decimal step handlers
  const ds1=()=>{if(parseInt(dIn.pw)===ex.correctPower){setDStep(2);setDFb("")}else{setDFb("Cuenta los decimales del DIVISOR → esa es la potencia.");consecCheck(tid,false)}};
  const ds2=()=>{
    const a=parseFloat(dIn.ad.replace(",",".")),b=parseFloat(dIn.as.replace(",","."));
    if(Math.abs(a-ex.ampDividend)<0.01&&Math.abs(b-ex.ampDivisor)<0.01){setDStep(3);setDFb("")}
    else setDFb(`Multiplica ambos por ${ex.correctPower}.`);
  };
  const ds3=()=>{
    const q=parseFloat(dIn.q.replace(",","."));
    if(Math.abs(q-ex.quotient)<0.01)finish(true);
    else{setDFb(`Divide ${ex.ampDividend.toString().replace(".",",")} ÷ ${ex.ampDivisor}.`);consecCheck(tid,false)}
  };

  const pct=stats.total?Math.round((stats.ok/stats.total)*100):0;
  const grade=getGrade(pct);
  const isRed=parseFloat(grade.replace(",","."))<4.0;

  const cs={background:"var(--card)",border:"1px solid var(--border)",borderRadius:16,padding:20};
  const btn1={padding:"12px 28px",borderRadius:12,background:"linear-gradient(135deg,var(--purple),var(--purple-dim))",color:"white",fontSize:15,fontWeight:600,boxShadow:"0 4px 20px var(--purple-glow)"};

  if(!named)return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#0a0618,#1a1040,#0f0a2a)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div className="anim-in" style={{...cs,padding:"48px 36px",maxWidth:440,width:"100%",textAlign:"center",border:"1px solid rgba(139,92,246,0.15)",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
        <div style={{fontSize:56,marginBottom:16,animation:"float 3s ease-in-out infinite"}}>📐</div>
        <h1 style={{color:"var(--text)",fontSize:26,fontWeight:800,marginBottom:4,background:"linear-gradient(135deg,var(--violet),var(--sky))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Guía Interactiva de Matemáticas</h1>
        <p style={{color:"var(--text-mid)",fontSize:14,marginBottom:8}}>Liceo Isidora Zegers — 7° Básico</p>
        <p style={{color:"var(--text-dim)",fontSize:12,marginBottom:28}}>OA2 / OA3</p>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Tu nombre..." onKeyDown={e=>e.key==="Enter"&&name.trim()&&setNamed(true)}
          style={{width:"100%",padding:"14px 18px",borderRadius:12,border:"1px solid var(--border)",background:"rgba(255,255,255,0.06)",color:"var(--text)",fontSize:16,marginBottom:16,fontFamily:"Outfit"}}/>
        <button onClick={()=>name.trim()&&setNamed(true)} style={{...btn1,width:"100%",fontSize:16,padding:14}}>¡Comenzar! 🚀</button>
      </div>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#0a0618,#1a1040,#0f0a2a)",color:"var(--text)"}}>
      <Confetti on={confetti}/>
      {toast&&<div className="anim-slide" style={{position:"fixed",top:80,right:16,background:"linear-gradient(135deg,#fbbf24,#f59e0b)",color:"#1a1040",padding:"14px 20px",borderRadius:14,zIndex:9998,display:"flex",alignItems:"center",gap:10,boxShadow:"0 8px 32px rgba(251,191,36,0.3)",maxWidth:300}}>
        <span style={{fontSize:28}}>{toast.icon}</span><div><p style={{fontSize:10,fontWeight:700,textTransform:"uppercase"}}>¡Logro!</p><p style={{fontWeight:800}}>{toast.name}</p></div>
      </div>}
      {kaModal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9997,padding:20}}>
        <div className="anim-in" style={{...cs,padding:32,maxWidth:420,width:"100%",textAlign:"center",border:"1px solid rgba(251,191,36,0.3)"}}>
          <div style={{fontSize:48,marginBottom:12}}>📚</div>
          <h3 style={{fontSize:18,fontWeight:700,marginBottom:8,color:"var(--amber)"}}>¡Necesitas repasar!</h3>
          <p style={{fontSize:14,color:"var(--text-mid)",marginBottom:20}}>2 errores seguidos en <b>{kaModal.topic}</b>.</p>
          <a href={KA[kaModal.ka]?.u||"https://es.khanacademy.org/math/arithmetic"} target="_blank" rel="noopener noreferrer"
            style={{display:"block",padding:"12px",borderRadius:12,background:"linear-gradient(135deg,#6d28d9,#4c1d95)",color:"white",fontWeight:600,textDecoration:"none",marginBottom:12}}>🎬 Khan Academy →</a>
          <button onClick={()=>setKaModal(null)} style={{padding:"10px 24px",borderRadius:10,background:"rgba(255,255,255,0.08)",color:"var(--text)",fontSize:14}}>Continuar</button>
        </div>
      </div>}

      <header style={{padding:"10px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid var(--border)",flexWrap:"wrap",gap:8,background:"rgba(10,6,24,0.8)",backdropFilter:"blur(12px)",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>📐</span>
          <div><h1 style={{fontSize:13,fontWeight:700}}>Matemáticas 7°</h1><p style={{fontSize:11,color:"var(--text-dim)"}}>{name}</p></div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          {stats.streak>1&&<span style={{background:"var(--rose-dim)",padding:"3px 10px",borderRadius:20,fontSize:12,color:"var(--rose)",fontWeight:600}}>🔥{stats.streak}</span>}
          {stats.total>0&&<span style={{fontSize:12,color:"var(--text-dim)"}}>Nota: <b style={{color:isRed?"var(--rose)":"var(--emerald)",fontSize:14}}>{grade}</b></span>}
          <nav style={{display:"flex",gap:2}}>
            {[["home","Temas"],["progress","Progreso"],["badges","Logros"]].map(([v,l])=>
              <button key={v} onClick={()=>{setView(v);setTid(null);setFb(null)}} style={{padding:"5px 12px",borderRadius:8,fontSize:12,fontWeight:view===v?700:400,background:view===v?"var(--purple)":"transparent",color:"var(--text)"}}>{l}</button>
            )}
          </nav>
        </div>
      </header>

      <main style={{maxWidth:880,margin:"0 auto",padding:"20px 14px"}}>

        {/* HOME */}
        {view==="home"&&<div className="anim-in">
          <h2 style={{textAlign:"center",fontSize:24,fontWeight:900,marginBottom:6,background:"linear-gradient(135deg,var(--violet),var(--sky))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Elige un tema</h2>
          <p style={{textAlign:"center",color:"var(--text-dim)",fontSize:13,marginBottom:24}}>Ejercicios ilimitados aleatorios</p>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
            {TOPICS.map(t=>{const ts=stats.bt[t.id];const p=ts?Math.round((ts.o/ts.t)*100):0;
              return<div key={t.id} className="topic-card" onClick={()=>start(t.id)} style={{...cs,cursor:"pointer",borderLeft:`3px solid ${t.color}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                  <span style={{background:`${t.color}33`,borderRadius:8,width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:14}}>{t.icon}</span>
                  {ts&&<span style={{fontSize:11,padding:"2px 8px",borderRadius:10,background:p>=70?"var(--emerald-dim)":p>=40?"var(--amber-dim)":"var(--rose-dim)",color:p>=70?"var(--emerald)":p>=40?"var(--amber)":"var(--rose)",fontWeight:600}}>{p}%</span>}
                </div>
                <h3 style={{fontSize:14,fontWeight:600,marginBottom:4}}>{t.name}</h3>
                <p style={{fontSize:11,color:"var(--text-dim)"}}>{ts?`${ts.t} intentos`:"Sin intentos"}</p>
                {ts&&<div style={{marginTop:8,height:4,borderRadius:2,background:"rgba(255,255,255,0.06)"}}><div style={{width:`${p}%`,height:"100%",borderRadius:2,background:t.color,transition:"width .5s"}}/></div>}
              </div>})}
          </div>
          {stats.total>0&&<div style={{...cs,marginTop:20,textAlign:"center",background:isRed?"var(--rose-dim)":"var(--emerald-dim)"}}>
            <p style={{fontSize:12,color:"var(--text-dim)"}}>Nota estimada</p>
            <span style={{fontSize:48,fontWeight:900,color:isRed?"var(--rose)":"var(--emerald)"}}>{grade}</span>
            <p style={{fontSize:12,color:"var(--text-dim)",marginTop:4}}>{pct}% · {stats.ok}/{stats.total} · Racha máx: {stats.mx}</p>
            {isRed&&<div style={{marginTop:12}}>
              <p style={{fontSize:13,color:"var(--amber)",marginBottom:10}}>⚠️ Bajo 4,0. ¡Repasa!</p>
              {Object.entries(stats.bt).filter(([_,v])=>(v.o/v.t)<0.6).map(([k])=>
                <a key={k} href={KA[k]?.u||"#"} target="_blank" rel="noopener noreferrer" style={{display:"block",color:"var(--violet)",fontSize:13,textDecoration:"underline",marginBottom:4}}>🎬 {KA[k]?.t||k} →</a>
              )}
              <button onClick={()=>save({total:0,ok:0,streak:0,mx:0,bt:{},badges:[...stats.badges],retried:true,consec:{}})}
                style={{marginTop:8,padding:"8px 20px",borderRadius:10,background:"var(--rose-dim)",color:"var(--rose)",fontSize:13,fontWeight:600}}>🔄 Reiniciar</button>
            </div>}
          </div>}
        </div>}

        {/* PRACTICE */}
        {view==="practice"&&tid&&ex&&<div className="anim-in">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
            <button onClick={()=>{setView("home");setTid(null);setFb(null)}} style={{padding:"5px 14px",borderRadius:8,background:"rgba(255,255,255,0.06)",color:"var(--text)",fontSize:12}}>← Volver</button>
            <h2 style={{fontSize:18,fontWeight:700}}>{TOPICS.find(t=>t.id===tid)?.name}</h2>
          </div>
          <div style={{...cs,padding:10,marginBottom:14,display:"flex",alignItems:"center",gap:10,background:"rgba(139,92,246,0.06)"}}>
            <span>🎬</span><a href={KA[ex.ka]?.u||"#"} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:"var(--violet)",textDecoration:"underline"}}>Repasa: {KA[ex.ka]?.t} →</a>
          </div>

          <div key={sk} className={fb&&!fb.ok?"anim-shake":""} style={{...cs,padding:24}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:6}}>
              <span style={{fontSize:11,color:"var(--text-dim)"}}>Ejercicio #{(stats.bt[tid]?.t||0)+(fb?0:1)}</span>
              <div style={{display:"flex",gap:5}}>
                {ex.showArea&&<button onClick={()=>setVisOn(!visOn)} style={{padding:"4px 10px",borderRadius:8,fontSize:11,fontWeight:600,background:visOn?"var(--purple)":"rgba(255,255,255,0.06)",color:"var(--text)"}}>📊 Área</button>}
                {ex.showLine&&<button onClick={()=>setVisOn(!visOn)} style={{padding:"4px 10px",borderRadius:8,fontSize:11,fontWeight:600,background:visOn?"var(--purple)":"rgba(255,255,255,0.06)",color:"var(--text)"}}>📊 Recta</button>}
                {ex.stepByStep&&<button onClick={()=>setStepsOn(!stepsOn)} style={{padding:"4px 10px",borderRadius:8,fontSize:11,fontWeight:600,background:stepsOn?"var(--emerald)":"rgba(255,255,255,0.06)",color:stepsOn?"#1a1040":"var(--text)"}}>📋 Método</button>}
                {ex.steps&&<button onClick={()=>setHelperOn(!helperOn)} style={{padding:"4px 10px",borderRadius:8,fontSize:11,fontWeight:600,background:helperOn?"var(--violet)":"rgba(255,255,255,0.06)",color:"var(--text)"}}>🧩 Guía</button>}
                <button onClick={()=>setHintOn(!hintOn)} style={{padding:"4px 10px",borderRadius:8,fontSize:11,fontWeight:600,background:hintOn?"var(--amber)":"rgba(255,255,255,0.06)",color:hintOn?"#1a1040":"var(--text)"}}>💡 Pista</button>
              </div>
            </div>

            {/* DISPLAY */}
            <div style={{textAlign:"center",marginBottom:20}}>
              {ex.type==="problem"&&<div style={{textAlign:"left",background:"rgba(255,255,255,0.03)",padding:18,borderRadius:14,fontSize:15,lineHeight:1.8}}>
                <p style={{fontWeight:600,marginBottom:8,color:"var(--violet)"}}>📝 Problema:</p>
                <p>{ex.text}{ex.fracInText?<>{" "}<F n={ex.fracInText.n} d={ex.fracInText.d} sz={14}/>{" "}</>:null}{ex.textAfter||""}{ex.fracInText2?<>{" "}<F n={ex.fracInText2.n} d={ex.fracInText2.d} sz={14}/>{" "}</>:null}{ex.textAfter2||""}</p>
              </div>}
              {ex.type==="combined"&&<div><p style={{fontSize:13,color:"var(--text-dim)",marginBottom:12}}>Resuelve respetando la jerarquía:</p><ExprF expr={ex.displayExpr} sz={24}/></div>}
              {ex.type==="frac"&&ex.display&&<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:14}}><F n={ex.display.n1} d={ex.display.d1} sz={24}/><span style={{color:"var(--violet)",fontSize:28,fontWeight:700}}>{ex.display.op}</span><F n={ex.display.n2} d={ex.display.d2} sz={24}/><span style={{color:"var(--text-dim)",fontSize:28}}>=</span></div>}
              {ex.type==="dec"&&<p style={{fontSize:28,fontWeight:700,fontFamily:"'Cambria Math',serif"}}>{ex.displayDec} <span style={{color:"var(--text-dim)"}}>=</span></p>}
              {ex.type==="toDec"&&<div><p style={{fontSize:13,color:"var(--text-dim)",marginBottom:8}}>Convierte a decimal:</p><span style={{fontSize:28}}><F n={ex.display.n1} d={ex.display.d1} sz={24}/><span style={{color:"var(--text-dim)",margin:"0 8px"}}>=</span></span></div>}
              {ex.type==="toFrac"&&<div><p style={{fontSize:13,color:"var(--text-dim)",marginBottom:8}}>Convierte a fracción irreducible:</p><span style={{fontSize:28,fontWeight:700}}>{ex.displayDec}</span><span style={{color:"var(--text-dim)",margin:"0 8px",fontSize:28}}>=</span></div>}
              {ex.type==="divDecStep"&&<div><p style={{fontSize:13,color:"var(--text-dim)",marginBottom:8}}>Divide paso a paso:</p><p style={{fontSize:28,fontWeight:700,fontFamily:"'Cambria Math',serif"}}>{ex.dividend.toString().replace(".",",")} ÷ {ex.divisor.toString().replace(".",",")} <span style={{color:"var(--text-dim)"}}>=</span></p></div>}
            </div>

            {/* VISUALS */}
            {visOn&&ex.showArea&&ex.display&&<AreaModel n1={ex.display.n1} d1={ex.display.d1} n2={ex.display.n2} d2={ex.display.d2}/>}
            {visOn&&ex.showLine&&ex.display&&<NumLine n1={ex.display.n1} d1={ex.display.d1} n2={ex.display.n2} d2={ex.display.d2}/>}

            {/* Dec mult method */}
            {stepsOn&&ex.stepByStep&&<div style={{padding:14,borderRadius:14,background:"rgba(52,211,153,0.06)",border:"1px solid rgba(52,211,153,0.15)",marginBottom:16}}>
              <p style={{fontSize:13,fontWeight:700,color:"var(--emerald)",marginBottom:8}}>📋 Multiplicación vertical:</p>
              <div style={{fontFamily:"monospace",fontSize:14,lineHeight:2}}>
                <p>1. Contar decimales: "{ex.stepByStep.a}" → {(ex.stepByStep.a.split(".")[1]||"").length}, "{ex.stepByStep.b}" → {(ex.stepByStep.b.split(".")[1]||"").length}. Total: <b>{ex.stepByStep.decPlaces}</b></p>
                <p>2. Multiplicar sin coma: {ex.stepByStep.a.replace(".","")} × {ex.stepByStep.b.replace(".","")} (empieza por la unidad del segundo número, luego decena dejando un espacio, etc.)</p>
                <p>3. Colocar la coma <b>{ex.stepByStep.decPlaces}</b> lugar(es) desde la derecha</p>
              </div>
            </div>}

            {/* Problem helper */}
            {helperOn&&ex.steps&&<div style={{padding:16,borderRadius:14,background:"rgba(139,92,246,0.06)",border:"1px solid rgba(139,92,246,0.15)",marginBottom:16}}>
              <p style={{fontSize:13,fontWeight:700,color:"var(--violet)",marginBottom:10}}>🧩 Guía paso a paso:</p>
              {ex.steps.map((s,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:6}}>
                <span style={{background:"var(--purple)",color:"white",width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</span>
                <p style={{fontSize:13,color:"var(--text-mid)",lineHeight:1.5}}>{s}</p>
              </div>)}
            </div>}

            {hintOn&&<div style={{background:"rgba(251,191,36,0.08)",border:"1px solid rgba(251,191,36,0.2)",borderRadius:12,padding:12,marginBottom:16,fontSize:13,color:"var(--amber)"}}>💡 {ex.hint}</div>}

            {/* STEP-BY-STEP DECIMAL DIVISION */}
            {ex.type==="divDecStep"&&!fb&&<div style={{marginBottom:16}}>
              <div style={{marginBottom:12,padding:16,borderRadius:14,border:`2px solid ${dStep===1?"var(--purple)":"rgba(255,255,255,0.06)"}`,background:dStep===1?"rgba(139,92,246,0.06)":"transparent",opacity:dStep>1?0.6:1}}>
                <h4 style={{fontSize:14,fontWeight:700,marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
                  <span style={{background:"var(--purple)",color:"white",width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>1</span>
                  ¿Potencia para que el divisor sea entero?
                  {dStep>1&&<span style={{color:"var(--emerald)",marginLeft:"auto"}}>✓</span>}
                </h4>
                <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                  {[10,100,1000].map(p=><label key={p} style={{display:"flex",alignItems:"center",gap:6,cursor:dStep>1?"default":"pointer",background:"rgba(255,255,255,0.04)",padding:"8px 14px",borderRadius:10,border:`1px solid ${dIn.pw===p.toString()?"var(--purple)":"var(--border)"}`,fontWeight:600}}>
                    <input type="radio" name="pw" value={p} checked={dIn.pw===p.toString()} onChange={e=>setDIn({...dIn,pw:e.target.value})} disabled={dStep>1} style={{accentColor:"var(--purple)"}}/>×{p}
                  </label>)}
                  {dStep===1&&<button onClick={ds1} style={{...btn1,padding:"8px 18px",fontSize:13,marginLeft:"auto"}}>Validar ✓</button>}
                </div>
              </div>
              {dStep>=2&&<div style={{marginBottom:12,padding:16,borderRadius:14,border:`2px solid ${dStep===2?"var(--amber)":"rgba(255,255,255,0.06)"}`,background:dStep===2?"rgba(251,191,36,0.06)":"transparent",opacity:dStep>2?0.6:1}}>
                <h4 style={{fontSize:14,fontWeight:700,marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
                  <span style={{background:"var(--amber)",color:"#1a1040",width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>2</span>
                  División amplificada (×{ex.correctPower}):
                  {dStep>2&&<span style={{color:"var(--emerald)",marginLeft:"auto"}}>✓</span>}
                </h4>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <input type="text" value={dIn.ad} onChange={e=>setDIn({...dIn,ad:e.target.value})} disabled={dStep>2} placeholder="Dividendo" style={{width:110,padding:8,textAlign:"center",borderRadius:10,border:"1px solid var(--border)",background:"rgba(255,255,255,0.06)",color:"var(--text)",fontSize:16,fontWeight:600}}/>
                  <span style={{fontSize:20,color:"var(--text-dim)"}}>÷</span>
                  <input type="text" value={dIn.as} onChange={e=>setDIn({...dIn,as:e.target.value})} disabled={dStep>2} placeholder="Divisor" style={{width:110,padding:8,textAlign:"center",borderRadius:10,border:"1px solid var(--border)",background:"rgba(255,255,255,0.06)",color:"var(--text)",fontSize:16,fontWeight:600}}/>
                  {dStep===2&&<button onClick={ds2} style={{...btn1,padding:"8px 18px",fontSize:13,marginLeft:"auto",background:"linear-gradient(135deg,#d97706,#b45309)"}}>Validar ✓</button>}
                </div>
              </div>}
              {dStep>=3&&<div style={{padding:16,borderRadius:14,border:"2px solid var(--emerald)",background:"rgba(52,211,153,0.06)"}}>
                <h4 style={{fontSize:14,fontWeight:700,marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
                  <span style={{background:"var(--emerald)",color:"#1a1040",width:24,height:24,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>3</span>
                  Resultado: {ex.ampDividend.toString().replace(".",",")} ÷ {ex.ampDivisor} =
                </h4>
                <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                  <input type="text" ref={ref} value={dIn.q} onChange={e=>setDIn({...dIn,q:e.target.value})} onKeyDown={e=>e.key==="Enter"&&ds3()}
                    placeholder="?" style={{width:120,padding:10,textAlign:"center",borderRadius:12,border:"2px solid rgba(52,211,153,0.3)",background:"rgba(255,255,255,0.06)",color:"var(--text)",fontSize:20,fontWeight:700}}/>
                  <button onClick={ds3} style={{...btn1,padding:"10px 24px",fontSize:14,background:"linear-gradient(135deg,#059669,#047857)",marginLeft:"auto"}}>Verificar ✓</button>
                </div>
              </div>}
              {dFb&&<p style={{color:"var(--rose)",textAlign:"center",fontWeight:600,marginTop:12,fontSize:13}}>⚠️ {dFb}</p>}
            </div>}

            {/* REGULAR INPUT */}
            {ex.type!=="divDecStep"&&!fb&&<div>
              <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:14,marginBottom:16}}>
                {(ex.type==="dec"||ex.type==="toDec"||ex.type==="problem")?
                  <input ref={ref} value={ua.dec} onChange={e=>setUa({...ua,dec:e.target.value})} onKeyDown={e=>e.key==="Enter"&&check()}
                    placeholder="Ej: 0,75" style={{width:150,textAlign:"center",padding:12,borderRadius:12,border:"1px solid var(--border)",background:"rgba(255,255,255,0.06)",color:"var(--text)",fontSize:22,fontWeight:600}}/>
                :<div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                    <label style={{fontSize:10,color:"var(--text-dim)",marginBottom:2}}>Entero</label>
                    <input ref={ref} value={ua.whole} onChange={e=>setUa({...ua,whole:e.target.value})} onKeyDown={e=>e.key==="Enter"&&check()}
                      placeholder="0" style={{width:56,textAlign:"center",padding:8,borderRadius:10,border:"1px solid var(--border)",background:"rgba(255,255,255,0.06)",color:"var(--text)",fontSize:20,fontWeight:700}}/>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                    <label style={{fontSize:10,color:"var(--text-dim)",marginBottom:2}}>Num</label>
                    <input value={ua.num} onChange={e=>setUa({...ua,num:e.target.value})} onKeyDown={e=>e.key==="Enter"&&check()}
                      placeholder="—" style={{width:56,textAlign:"center",padding:8,borderRadius:"10px 10px 0 0",border:"1px solid var(--border)",borderBottom:"3px solid var(--violet)",background:"rgba(255,255,255,0.06)",color:"var(--text)",fontSize:20,fontWeight:700}}/>
                    <input value={ua.den} onChange={e=>setUa({...ua,den:e.target.value})} onKeyDown={e=>e.key==="Enter"&&check()}
                      placeholder="—" style={{width:56,textAlign:"center",padding:8,borderRadius:"0 0 10px 10px",border:"1px solid var(--border)",borderTop:"none",background:"rgba(255,255,255,0.06)",color:"var(--text)",fontSize:20,fontWeight:700}}/>
                    <label style={{fontSize:10,color:"var(--text-dim)",marginTop:2}}>Den</label>
                  </div>
                </div>}
              </div>
              <button onClick={check} style={{...btn1,width:"100%",animation:"glow 2s infinite"}}>Verificar ✓</button>
            </div>}

            {/* FEEDBACK */}
            {fb&&<div style={{marginTop:16,padding:16,borderRadius:14,textAlign:"center",background:fb.ok?"var(--emerald-dim)":"var(--rose-dim)",border:`1px solid ${fb.ok?"rgba(52,211,153,0.3)":"rgba(251,113,133,0.3)"}`}}>
              <p style={{fontSize:18,fontWeight:800,color:fb.ok?"var(--emerald)":"var(--rose)",marginBottom:6}}>{fb.msg}</p>
              {!fb.ok&&<p style={{fontSize:13,color:"var(--text-dim)"}}>Correcta: <b style={{color:"var(--text)"}}>
                {ex.ans?.n!=null&&ex.ans.d!==1?<F n={ex.ans.n} d={ex.ans.d} sz={14}/>:fb.corr}
              </b>
                {ex.ans?.n!=null&&ex.ans?.d>1&&ex.ans.n>ex.ans.d&&<span style={{marginLeft:10}}>= {toMixed(ex.ans.n,ex.ans.d).w} <F n={toMixed(ex.ans.n,ex.ans.d).n} d={toMixed(ex.ans.n,ex.ans.d).d} sz={12}/></span>}
              </p>}
              {fb.ok&&ex.ans?.n!=null&&ex.ans?.d>1&&ex.ans.n>ex.ans.d&&
                <p style={{fontSize:13,color:"var(--text-mid)",marginTop:4}}>Mixto: {toMixed(ex.ans.n,ex.ans.d).w} <F n={toMixed(ex.ans.n,ex.ans.d).n} d={toMixed(ex.ans.n,ex.ans.d).d} sz={13}/></p>}
              <button onClick={()=>{setFb(null);gen(tid)}} style={{...btn1,marginTop:14,padding:"10px 28px"}}>Siguiente →</button>
            </div>}
          </div>

          {stats.bt[tid]&&<div style={{...cs,marginTop:14,padding:14}}>
            <div style={{display:"flex",justifyContent:"space-around",textAlign:"center"}}>
              {[["Intentos",stats.bt[tid].t,"var(--violet)"],["Correctos",stats.bt[tid].o,"var(--emerald)"],["%",Math.round((stats.bt[tid].o/stats.bt[tid].t)*100)+"%","var(--amber)"],["Racha",stats.streak+"🔥","var(--rose)"]].map(([l,v,c])=>
                <div key={l}><p style={{fontSize:22,fontWeight:800,color:c}}>{v}</p><p style={{fontSize:10,color:"var(--text-dim)"}}>{l}</p></div>
              )}
            </div>
          </div>}
        </div>}

        {/* PROGRESS */}
        {view==="progress"&&<div className="anim-in">
          <h2 style={{fontSize:24,fontWeight:900,marginBottom:20,textAlign:"center",background:"linear-gradient(135deg,var(--violet),var(--emerald))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>📊 Progreso</h2>
          {stats.total===0?<div style={{...cs,textAlign:"center",padding:40}}><p style={{fontSize:48}}>🌱</p><p style={{color:"var(--text-dim)"}}>Comienza a practicar</p></div>
          :<><div style={{...cs,textAlign:"center",padding:28,marginBottom:20}}>
            <p style={{fontSize:12,color:"var(--text-dim)"}}>Nota estimada</p>
            <span style={{fontSize:56,fontWeight:900,color:isRed?"var(--rose)":"var(--emerald)"}}>{grade}</span>
            <p style={{fontSize:12,color:"var(--text-dim)",marginTop:4}}>{pct}% · {stats.ok}/{stats.total} · Racha máx: {stats.mx}</p>
          </div>
          <div style={cs}><h3 style={{fontSize:15,fontWeight:700,marginBottom:14}}>Por tema</h3>
            {TOPICS.map(t=>{const ts=stats.bt[t.id];const p=ts?Math.round((ts.o/ts.t)*100):0;
              return<div key={t.id} style={{marginBottom:14}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:13}}>{t.icon} {t.name}</span>
                  <span style={{fontSize:12,color:"var(--text-dim)"}}>{ts?`${ts.o}/${ts.t} (${p}%)`:"—"}</span>
                </div>
                <div style={{height:6,borderRadius:3,background:"rgba(255,255,255,0.06)"}}>
                  <div style={{width:`${p}%`,height:"100%",borderRadius:3,background:p>=70?"var(--emerald)":p>=40?"var(--amber)":"var(--rose)",transition:"width .8s"}}/>
                </div>
                {ts&&p<60&&<a href={KA[t.id]?.u||"#"} target="_blank" style={{fontSize:11,color:"var(--violet)",textDecoration:"underline"}}>🎬 Repasar →</a>}
              </div>})}
          </div></>}
        </div>}

        {/* BADGES */}
        {view==="badges"&&<div className="anim-in">
          <h2 style={{fontSize:24,fontWeight:900,marginBottom:20,textAlign:"center",background:"linear-gradient(135deg,var(--amber),var(--rose))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>🏅 Logros ({stats.badges.length}/{BADGES.length})</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12}}>
            {BADGES.map(b=>{const u=stats.badges.includes(b.id);return<div key={b.id} style={{...cs,textAlign:"center",padding:20,opacity:u?1:0.3,border:u?"1px solid rgba(251,191,36,0.3)":"1px solid var(--border)"}}>
              <div style={{fontSize:36,marginBottom:8}}>{b.icon}</div>
              <h3 style={{fontSize:14,fontWeight:700,marginBottom:4}}>{b.name}</h3>
              <p style={{fontSize:12,color:"var(--text-dim)"}}>{b.desc}</p>
              {u&&<span style={{display:"inline-block",marginTop:8,fontSize:11,padding:"2px 10px",borderRadius:10,background:"var(--emerald-dim)",color:"var(--emerald)"}}>✓</span>}
            </div>})}
          </div>
        </div>}
      </main>

      <footer style={{textAlign:"center",padding:"20px 14px",color:"var(--text-dim)",fontSize:11,marginTop:40}}>
        <p>Liceo Isidora Zegers — Matemática 7° Básico — OA2 · OA3</p>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
